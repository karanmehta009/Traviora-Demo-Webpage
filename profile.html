<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Dashboard | Traviora</title>
  
  <!-- Icon & Styling CDNs -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  
  <style>
    /* Profile Dashboard Page Layout */
    .breadcrumb-section {
      padding: 100px 0 20px;
      background-color: var(--light-gray);
      border-bottom: 1px solid var(--border-color);
    }
    
    .breadcrumbs {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      gap: 8px;
    }
    
    .profile-container {
      padding: 50px 0 80px;
    }
    
    .profile-grid {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 40px;
      align-items: start;
    }
    
    /* Sidebar Details Card */
    .profile-sidebar {
      background-color: var(--pure-white);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 30px 20px;
      text-align: center;
      box-shadow: var(--shadow-sm);
    }
    
    .profile-avatar-wrapper {
      position: relative;
      width: 110px;
      height: 110px;
      margin: 0 auto 20px;
    }
    
    .profile-avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--accent-gold);
    }
    
    .profile-avatar-badge {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-color: var(--primary-navy);
      color: var(--accent-gold);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--pure-white);
      font-size: 0.8rem;
    }
    
    .sidebar-user-name {
      font-family: var(--font-body);
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary-navy);
      margin-bottom: 4px;
    }
    
    .sidebar-user-email {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 25px;
    }
    
    /* Navigation tabs menu */
    .profile-tabs-nav {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .profile-tab-btn {
      width: 100%;
      padding: 12px 20px;
      border-radius: var(--radius-md);
      text-align: left;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-dark);
      background-color: transparent;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: var(--transition);
    }
    
    .profile-tab-btn i {
      font-size: 1.1rem;
      width: 20px;
      color: var(--text-muted);
      transition: var(--transition);
    }
    
    .profile-tab-btn:hover {
      background-color: var(--light-gray);
      color: var(--accent-gold);
    }
    
    .profile-tab-btn.active {
      background-color: var(--primary-navy);
      color: var(--pure-white);
    }
    
    .profile-tab-btn.active i {
      color: var(--accent-gold);
    }

    /* Content Area */
    .profile-content-panel {
      background-color: var(--pure-white);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 40px;
      box-shadow: var(--shadow-sm);
      min-height: 480px;
    }
    
    .tab-content-panel {
      display: none;
    }
    
    .tab-content-panel.active {
      display: block;
      animation: fadeIn 0.4s ease;
    }
    
    .tab-title-header {
      font-size: 1.6rem;
      margin-bottom: 30px;
      border-bottom: 2.5px solid var(--accent-gold);
      padding-bottom: 10px;
    }
    
    /* Active Bookings Card */
    .booking-history-card {
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      overflow: hidden;
      margin-bottom: 20px;
      background-color: var(--pure-white);
    }
    
    .booking-card-header {
      background-color: var(--off-white);
      padding: 15px 25px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    
    .booking-card-header strong {
      color: var(--primary-navy);
    }
    
    .booking-card-body {
      padding: 25px;
      display: grid;
      grid-template-columns: 80px 1fr auto;
      gap: 25px;
      align-items: center;
    }
    
    .booking-item-img {
      width: 80px;
      height: 80px;
      border-radius: var(--radius-md);
      object-fit: cover;
    }
    
    .booking-item-title {
      font-family: var(--font-body);
      font-size: 1.15rem;
      color: var(--primary-navy);
      margin-bottom: 5px;
    }
    
    .booking-item-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    
    .booking-card-footer {
      border-top: 1px solid var(--border-color);
      padding: 15px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
    }
    
    .booking-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
    }
    
    .booking-status.status-confirmed { color: var(--success); }
    .booking-status.status-cancelled { color: var(--danger); }
    
    /* Form elements */
    .form-group {
      margin-bottom: 20px;
    }
    
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--primary-navy);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .form-control {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      background-color: var(--off-white);
      font-size: 0.95rem;
      transition: var(--transition);
    }
    
    .form-control:focus {
      border-color: var(--accent-gold);
      background-color: var(--pure-white);
      outline: none;
    }
    
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 1024px) {
      .profile-grid {
        grid-template-columns: 1fr;
      }
    }
    
    @media (max-width: 768px) {
      .booking-card-body {
        grid-template-columns: 1fr;
        text-align: center;
        gap: 15px;
      }
      
      .booking-item-img {
        margin: 0 auto;
      }
      
      .form-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- Dynamic Header Navigation -->
  <header class="header" id="header-placeholder"></header>

  <!-- Breadcrumbs -->
  <section class="breadcrumb-section">
    <div class="container">
      <div class="breadcrumbs">
        <a href="index.html">Home</a>
        <span>&bull;</span>
        <span style="color: var(--text-dark); font-weight: 500;">My Account</span>
      </div>
    </div>
  </section>

  <!-- Dashboard Container -->
  <div class="container profile-container">
    <div class="profile-grid">
      
      <!-- Left Profile Sidebar -->
      <aside>
        <div class="profile-sidebar">
          <div class="profile-avatar-wrapper">
            <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&h=150" class="profile-avatar-img" id="sidebar-avatar" alt="Avatar">
            <div class="profile-avatar-badge" title="Traviora Gold Explorer"><i class="fa-solid fa-crown"></i></div>
          </div>
          <h3 class="sidebar-user-name" id="sidebar-name">Karan Mehta</h3>
          <p class="sidebar-user-email" id="sidebar-email">karan.mehta@gmail.com</p>
          
          <nav class="profile-tabs-nav">
            <button class="profile-tab-btn active" onclick="switchDashboardTab('bookings', this)"><i class="fa-solid fa-suitcase"></i> My Bookings</button>
            <button class="profile-tab-btn" onclick="switchDashboardTab('wishlist', this)" id="btn-tab-wishlist"><i class="fa-solid fa-heart"></i> My Wishlist</button>
            <button class="profile-tab-btn" onclick="switchDashboardTab('settings', this)"><i class="fa-solid fa-gears"></i> Settings</button>
          </nav>
        </div>
      </aside>
      
      <!-- Right Content Panel -->
      <main class="profile-content-panel">
        
        <!-- TAB 1: BOOKINGS -->
        <section class="tab-content-panel active" id="tab-bookings">
          <h2 class="tab-title-header">Active Bookings & Stays</h2>
          <div id="bookings-history-list">
            <!-- Populated dynamically -->
          </div>
        </section>
        
        <!-- TAB 2: WISHLIST -->
        <section class="tab-content-panel" id="tab-wishlist">
          <h2 class="tab-title-header">My Wishlist</h2>
          <div class="grid grid-2" id="wishlist-items-grid">
            <!-- Populated dynamically -->
          </div>
        </section>
        
        <!-- TAB 3: SETTINGS -->
        <section class="tab-content-panel" id="tab-settings">
          <h2 class="tab-title-header">Account Settings</h2>
          <form id="profile-settings-form">
            <div class="form-row">
              <div class="form-group">
                <label for="settings-name">Full Name</label>
                <input type="text" class="form-control" id="settings-name" required>
              </div>
              <div class="form-group">
                <label for="settings-email">Email Address</label>
                <input type="email" class="form-control" id="settings-email" required>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="settings-phone">Phone Number</label>
                <input type="tel" class="form-control" id="settings-phone" required>
              </div>
              <div class="form-group">
                <label for="settings-avatar">Profile Avatar URL</label>
                <input type="url" class="form-control" id="settings-avatar">
              </div>
            </div>
            <button type="submit" class="btn btn-primary" style="margin-top:10px">Save Profile Changes</button>
          </form>
        </section>
        
      </main>
      
    </div>
  </div>

  <!-- Dynamic Footer Placeholder -->
  <footer class="footer" id="footer-placeholder"></footer>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/ai-assistant.js"></script>
  
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // 1. Render layout components
      window.renderHeader('profile');
      window.renderFooter();
      
      // 2. Load User Info
      loadUserProfile();
      
      // 3. Render Bookings History & Wishlists
      renderBookingsHistory();
      renderWishlistGrid();
      
      // 4. Handle settings form submit
      const settingsForm = document.getElementById("profile-settings-form");
      settingsForm.addEventListener("submit", (e) => {
        e.preventDefault();
        
        const updatedUser = {
          name: document.getElementById("settings-name").value.trim(),
          email: document.getElementById("settings-email").value.trim(),
          phone: document.getElementById("settings-phone").value.trim(),
          avatar: document.getElementById("settings-avatar").value.trim()
        };
        
        window.TravioraDb.setUser(updatedUser);
        loadUserProfile();
        window.renderHeader('profile'); // Refresh dynamic name in headers
        window.showToast("Account details updated successfully!", "success");
      });
      
      // Handle page hash tab routing (e.g. index.html clicking wishlist badges goes to #wishlist tab)
      handleHashRouting();
      window.addEventListener("hashchange", handleHashRouting);
    });

    function loadUserProfile() {
      const user = window.TravioraDb.getUser();
      
      document.getElementById("sidebar-name").textContent = user.name;
      document.getElementById("sidebar-email").textContent = user.email;
      document.getElementById("sidebar-avatar").src = user.avatar;
      
      // Settings form fields
      document.getElementById("settings-name").value = user.name;
      document.getElementById("settings-email").value = user.email;
      document.getElementById("settings-phone").value = user.phone;
      document.getElementById("settings-avatar").value = user.avatar;
    }

    function renderBookingsHistory() {
      const listEl = document.getElementById("bookings-history-list");
      if (!listEl) return;
      
      const bookings = window.TravioraDb.getBookings();
      
      if (bookings.length === 0) {
        listEl.innerHTML = `
          <div style="text-align:center; padding:50px 20px; border:1px dashed var(--border-color); border-radius:var(--radius-md);">
            <i class="fa-solid fa- suitcase" style="font-size:2.5rem;color:var(--text-muted);margin-bottom:15px;display:block"></i>
            <p>You have no active bookings currently.</p>
            <a href="tours.html" class="btn btn-primary btn-sm" style="margin-top:15px">Explore Packages</a>
          </div>
        `;
        return;
      }
      
      // Render reverse chronological bookings list
      listEl.innerHTML = bookings.slice().reverse().map(b => `
        <div class="booking-history-card">
          <div class="booking-card-header">
            <span>Booking Reference: <strong>${b.id}</strong></span>
            <span>Transaction Date: ${b.created}</span>
          </div>
          <div class="booking-card-body">
            <img src="${b.itemImage}" class="booking-item-img" alt="Booking item">
            <div>
              <h3 class="booking-item-title">${b.itemName}</h3>
              <div class="booking-item-meta">
                <span><i class="fa-regular fa-calendar" style="margin-right:4px"></i> Travel Date: <strong>${b.date}</strong></span>
                <span style="margin-left:15px"><i class="fa-solid fa-users" style="margin-right:4px"></i> Guests: <strong>${b.guests}</strong></span>
                ${b.nights ? `<span style="margin-left:15px"><i class="fa-solid fa-moon" style="margin-right:4px"></i> Nights: <strong>${b.nights}</strong></span>` : ''}
              </div>
            </div>
            <div>
              <span style="font-size:0.8rem;color:var(--text-muted);display:block;text-align:right">Charged Amount</span>
              <strong style="font-size:1.4rem;color:var(--primary-navy)">₹${b.amount.toLocaleString('en-IN')}</strong>
            </div>
          </div>
          <div class="booking-card-footer">
            <div class="booking-status ${b.status === 'Confirmed' ? 'status-confirmed' : 'status-cancelled'}">
              <i class="fa-solid ${b.status === 'Confirmed' ? 'fa-circle-check' : 'fa-circle-xmark'}"></i>
              <span>${b.status}</span>
            </div>
            ${b.status === 'Confirmed' ? 
              `<button class="btn btn-outline btn-sm" style="border-color:var(--danger);color:var(--danger);" onclick="triggerCancelBooking('${b.id}')"><i class="fa-regular fa-trash-can"></i> Cancel Reservation</button>` : 
              `<span style="font-size:0.8rem;color:var(--text-muted)">Refund processed to card</span>`
            }
          </div>
        </div>
      `).join('');
    }

    // Trigger Cancel Booking prompt
    window.triggerCancelBooking = function(bookingId) {
      window.showModal(
        "Confirm Cancellation",
        `<div style="text-align:center;padding:10px 0;">
          <i class="fa-regular fa-circle-question" style="font-size:3.5rem;color:var(--danger);margin-bottom:15px;display:block"></i>
          <p style="margin-bottom:25px;font-size:1.05rem">Are you sure you want to cancel booking <strong>${bookingId}</strong>? You will receive a full refund in 3-5 business days.</p>
          <div style="display:flex;justify-content:center;gap:15px">
            <button class="btn btn-primary" style="background-color:var(--danger);border-color:var(--danger)" onclick="confirmCancellation('${bookingId}')">Confirm Cancellation</button>
            <button class="btn btn-outline" onclick="window.closeModal()">Keep Booking</button>
          </div>
        </div>`
      );
    };

    window.confirmCancellation = function(bookingId) {
      window.TravioraDb.cancelBooking(bookingId);
      window.closeModal();
      renderBookingsHistory();
      window.showToast("Reservation canceled successfully. Refund initialized.", "info");
    };

    // Render Wishlist
    function renderWishlistGrid() {
      const grid = document.getElementById("wishlist-items-grid");
      if (!grid) return;
      
      const wishlistIds = window.TravioraDb.getWishlist();
      
      if (wishlistIds.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1/-1; text-align:center; padding:50px 20px; border:1px dashed var(--border-color); border-radius:var(--radius-md);">
            <i class="fa-regular fa-heart" style="font-size:2.5rem;color:var(--text-muted);margin-bottom:15px;display:block"></i>
            <p>Your wishlist is empty.</p>
            <a href="tours.html" class="btn btn-primary btn-sm" style="margin-top:15px">Discover Trips</a>
          </div>
        `;
        return;
      }
      
      // Fetch details from either tours or hotels database
      const allItems = [...window.TravioraDb.getTours(), ...window.TravioraDb.getHotels()];
      const wishlistItems = allItems.filter(item => wishlistIds.includes(item.id));
      
      grid.innerHTML = wishlistItems.map(item => {
        const isHotel = item.id.startsWith("h-");
        const detailsUrl = isHotel ? `hotel-details.html?id=${item.id}` : `tour-details.html?id=${item.id}`;
        
        return `
          <div class="tour-card">
            <div class="card-img-wrapper" style="height:160px">
              <button class="wishlist-btn active" data-id="${item.id}" onclick="removeFromWishlist('${item.id}', this)"><i class="fa-solid fa-heart active" style="color:var(--danger)"></i></button>
              <img src="${item.image}" class="card-img" alt="${item.name}">
            </div>
            <div class="card-content" style="padding:18px">
              <span style="font-size:0.75rem; text-transform:uppercase; color:var(--accent-gold); font-weight:700">${isHotel ? 'Stay' : 'Tour Package'}</span>
              <h3 class="card-title" style="font-size:1.1rem; margin:5px 0 10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${item.name}</h3>
              <div class="card-rating" style="margin-bottom:12px;font-size:0.75rem;">
                <i class="fas fa-star" style="color:#FFB800"></i>
                <span>${item.rating} (${item.reviewsCount} reviews)</span>
              </div>
              <div class="card-footer" style="padding-top:10px; border-top:1px solid var(--border-color)">
                <div class="card-price">${isHotel ? 'Per Night' : 'Starting From'} <span style="font-size:1.15rem">₹${item.price.toLocaleString('en-IN')}</span></div>
                <a href="${detailsUrl}" class="btn btn-secondary btn-sm">Details</a>
              </div>
            </div>
          </div>
        `;
      }).join('');
      
      // Update badge counts in header
      window.updateWishlistBadges();
    }

    window.removeFromWishlist = function(itemId, element) {
      window.TravioraDb.toggleWishlist(itemId);
      renderWishlistGrid();
      window.showToast("Removed from wishlist.", "info");
    };

    // Tab switcher
    window.switchDashboardTab = function(tabName, button) {
      // Hide all panels
      document.querySelectorAll(".tab-content-panel").forEach(p => p.classList.remove("active"));
      // Show selected panel
      document.getElementById(`tab-${tabName}`).classList.add("active");
      
      // Set active button styles
      document.querySelectorAll(".profile-tab-btn").forEach(b => b.classList.remove("active"));
      button.classList.add("active");
      
      // Update window hash
      window.location.hash = tabName;
    };

    function handleHashRouting() {
      const hash = window.location.hash.substring(1);
      if (!hash) return;
      
      let tabBtn = null;
      if (hash === "bookings") {
        tabBtn = document.querySelectorAll(".profile-tab-btn")[0];
      } else if (hash === "wishlist") {
        tabBtn = document.querySelectorAll(".profile-tab-btn")[1];
      } else if (hash === "settings") {
        tabBtn = document.querySelectorAll(".profile-tab-btn")[2];
      }
      
      if (tabBtn) {
        switchDashboardTab(hash, tabBtn);
      }
    }
    
    // Listen for global wishlist updates to keep lists in sync
    document.addEventListener("wishlistUpdated", () => {
      renderWishlistGrid();
    });
  </script>
</body>
</html>
